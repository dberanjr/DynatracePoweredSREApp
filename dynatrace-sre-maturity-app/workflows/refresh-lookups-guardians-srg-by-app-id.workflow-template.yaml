metadata:
  version: '1'
  dependencies:
    apps:
    - id: dynatrace.automations
      version: ^1.3590.2
  inputs: []
workflow:
  title: 'DT-SRE APP: Refresh /lookups/dtsrepoweredapp/guardians (SRG by AppId)'
  description: Daily refresh of the /lookups/dtsrepoweredapp/guardians table from Site Reliability
    Guardian settings objects, keyed by the application ID tag. Feeds the L2
    Error Budget Tracking scorecard check.
  schemaVersion: 4
  trigger:
    schedule:
      isActive: true
      trigger:
        cron: 0 6 * * *
        type: cron
      filterParameters: {}
      timezone: UTC
      inputs: {}
  result: null
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  guide: null
  tasks:
    refresh_guardians_lookup:
      name: refresh_guardians_lookup
      input:
        script: |
          import { settingsObjectsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { queryExecutionClient } from '@dynatrace-sdk/client-query';

          // ── Customer values, read at run time ─────────────────────────────────────────────────────────────────────────────
          // Every DT-SRE APP workflow except "Build /lookups/dtsrepoweredapp/cmdb" is identical for all customers. The few values
          // that differ (the application ID tag key, the cloud tag key, the longest ID) are written to
          // /lookups/dtsrepoweredapp/config by that workflow from its constants, and read here. Run it first.
          // The generated queries contain the placeholders __APPIDKEY__, __CLOUDTAGKEY__ and __IDMAX__; applyAppConfig fills them in.
          const APP_CONFIG_PATH = '/lookups/dtsrepoweredapp/config';

          async function loadAppConfig() {
            let records;
            try {
              const started = await queryExecutionClient.queryExecute({
                body: { query: 'load "' + APP_CONFIG_PATH + '"', maxResultRecords: 100, requestTimeoutMilliseconds: 30000 },
              });
              records = started.result ? started.result.records || [] : null;
              for (let i = 0; records === null && i < 60; i++) {
                await new Promise((r) => setTimeout(r, 500));
                const p = await queryExecutionClient.queryPoll({ requestToken: started.requestToken });
                if (p.state === 'SUCCEEDED') records = (p.result && p.result.records) || [];
                else if (p.state !== 'NOT_STARTED' && p.state !== 'RUNNING') throw new Error('query ended in state ' + p.state);
              }
              if (records === null) throw new Error('query timed out');
            } catch (e) {
              throw new Error('Cannot read ' + APP_CONFIG_PATH + '. Run the "DT-SRE APP: Build /lookups/dtsrepoweredapp/cmdb" workflow first, which writes it. (' + (e && e.message ? e.message : e) + ')');
            }
            const raw = {};
            for (const r of records) raw[String(r.key)] = String(r.value === undefined || r.value === null ? '' : r.value).trim();
            const ident = /^[A-Za-z_][A-Za-z0-9_]*$/;
            if (!ident.test(raw.appIdKey || '')) throw new Error(APP_CONFIG_PATH + ' has no valid appIdKey (found "' + raw.appIdKey + '").');
            const cloudTagKey = raw.cloudTagKey || raw.appIdKey;
            if (!ident.test(cloudTagKey)) throw new Error(APP_CONFIG_PATH + ' has an invalid cloudTagKey "' + cloudTagKey + '".');
            const idMaxLength = Number(raw.idMaxLength);
            if (!Number.isInteger(idMaxLength) || idMaxLength < 1 || idMaxLength > 64) throw new Error(APP_CONFIG_PATH + ' has an invalid idMaxLength "' + raw.idMaxLength + '".');
            return { appIdKey: raw.appIdKey, cloudTagKey, idMaxLength };
          }

          function applyAppConfig(text, c) {
            return text.split('__APPIDKEY__').join(c.appIdKey).split('__CLOUDTAGKEY__').join(c.cloudTagKey).split('__IDMAX__').join(String(c.idMaxLength));
          }

          // Refreshes the guardians lookup table (appId -> guardianCount) from the
          // Site Reliability Guardian settings objects, matching on the application ID tag (the key comes from the run-time config; "appci" is accepted as a shorthand).
          export default async function () {
            const cfg = await loadAppConfig();
            const TAG_KEYS = [cfg.appIdKey, cfg.cloudTagKey, 'appci'].map((k) => k.toLowerCase());
            // 1. Read all guardian settings objects
            const res = await settingsObjectsClient.getSettingsObjects({
              schemaIds: 'app:dynatrace.site.reliability.guardian:guardians',
              fields: 'value',
              pageSize: 500,
            });
            const items = res.items || [];

            // 2. Aggregate appId -> distinct guardian count (case-insensitive tag key + value)
            const counts = {};
            for (const obj of items) {
              const tags = (obj.value && obj.value.tags) || [];
              const appIds = new Set();
              for (const t of tags) {
                const i = String(t).indexOf(':');
                if (i > 0) {
                  const k = String(t).slice(0, i).trim().toLowerCase();
                  const v = String(t).slice(i + 1).trim().toLowerCase();
                  if (TAG_KEYS.includes(k) && v) appIds.add(v);
                }
              }
              for (const a of appIds) counts[a] = (counts[a] || 0) + 1;
            }

            // 3. Build CSV (header is skipped on upload via skippedRecords:1)
            const appIds = Object.keys(counts).sort();
            // A 0-row lookup exposes no columns, so every consumer's `lookup`/`fieldsAdd appId` fails with
            // FIELD_DOES_NOT_EXIST. When nothing matches, keep the schema alive with a sentinel row whose
            // appId can never equal a real application ID (it never joins to a scorecard row).
            const rows = appIds.map((a) => `${a},${counts[a]}`);
            if (rows.length === 0) rows.push('__none__,0');
            const csv = 'appId,guardianCount\n' + rows.join('\n') + '\n';

            // 4. Upload as a lookup table (overwrite existing)
            const meta = {
              filePath: '/lookups/dtsrepoweredapp/guardians',
              displayName: 'Guardians by application ID',
              description: 'Count of Site Reliability Guardians per application ID, refreshed from the guardian Settings API',
              lookupField: 'appId',
              parsePattern: "LD:appId ',' LD:guardianCount",
              skippedRecords: 1,
              autoFlatten: true,
              timezone: 'UTC',
              locale: 'en_US',
              overwrite: true,
            };

            const boundary = '----guardianlookupboundary' + Date.now();
            const body =
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="request"\r\n` +
              `Content-Type: application/json\r\n\r\n` +
              `${JSON.stringify(meta)}\r\n` +
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="content"; filename="guardians"\r\n` +
              `Content-Type: application/octet-stream\r\n\r\n` +
              `${csv}\r\n` +
              `--${boundary}--\r\n`;

            const resp = await fetch('/platform/storage/resource-store/v1/files/tabular/lookup:upload', {
              method: 'POST',
              headers: { 'Content-Type': `multipart/form-data; boundary=${boundary}` },
              body,
            });

            const text = await resp.text();
            if (!resp.ok) {
              throw new Error(`Lookup upload failed: ${resp.status} ${text}`);
            }
            return { guardiansRead: items.length, appIdRows: appIds.length, counts };
          }
      action: dynatrace.automations:run-javascript
      position:
        x: 0
        y: 1
      conditions:
        states: {}
      description: Read guardians, aggregate application ID->count, upload lookup table
      predecessors: []
