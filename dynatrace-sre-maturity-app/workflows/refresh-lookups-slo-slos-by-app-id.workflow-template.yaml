metadata:
  version: '1'
  dependencies:
    apps:
    - id: dynatrace.automations
      version: ^1.3590.2
  inputs: []
workflow:
  title: 'DT-SRE APP: Refresh /lookups/dtsrepoweredapp/slo (SLOs by AppId)'
  description: Hourly refresh of /lookups/dtsrepoweredapp/slo from the Gen3 SLO platform API.
    Writes one row per SLO name; the scorecard derives the application ID from the first 3 characters
    of each name. Feeds the L2 SLOs Created check in ScorecardsPage and MaturityLeaderboard.
  schemaVersion: 4
  trigger:
    schedule:
      isActive: true
      trigger:
        cron: 0 * * * *
        type: cron
      filterParameters: {}
      timezone: UTC
      inputs: {}
  result: null
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  guide: null
  tasks:
    refresh_slo_lookup:
      name: refresh_slo_lookup
      input:
        script: |
          // Refreshes the SLOs lookup (/lookups/dtsrepoweredapp/slo; one row per SLO name) from the Gen3 SLO platform API.
          // Each SLO's application ID is its `<tagKey>:<id>` tag (any of the configured tag keys), falling back to the name up to its first separator when the SLO
          // has no such tag (and the prefix is no longer than the configured longest ID). The key and length come from the run-time config.
          // NOTE: the platform SLO API rejects page-size when page-key is set — first
          // page uses page-size, subsequent pages use page-key only (confirmed in getSloDetail.function.ts).
          import { queryExecutionClient } from '@dynatrace-sdk/client-query';

          // ── Customer settings, read at run time ───────────────────────────────────────────────────────────────────────────────
          // Every DT-SRE APP workflow is identical for all customers. What differs (the application ID tag keys, the cloud tag key,
          // the longest ID and, for the catalog workflow, the source table and its column mapping) is read from
          // /lookups/dtsrepoweredapp/config, which the app's Settings page writes. Until Settings have been saved, the workflows stop
          // with an error that says so.
          // The generated queries contain markers and placeholders that applyAppConfig fills in: __TAGHIT__(<tags array>) for
          // "this entity carries one of the tag keys", and __APPIDKEY__ (the first tag key), __CLOUDTAGKEY__ and __IDMAX__.
          const APP_CONFIG_PATH = '/lookups/dtsrepoweredapp/config';

          async function loadAppConfig() {
            let records;
            try {
              const started = await queryExecutionClient.queryExecute({
                body: { query: 'load "' + APP_CONFIG_PATH + '"', maxResultRecords: 100, requestTimeoutMilliseconds: 30000 },
              });
              records = started.result ? started.result.records || [] : null;
              for (let i = 0; records === null && i < 60; i++) {
                await new Promise((r) => setTimeout(r, 500));
                const p = await queryExecutionClient.queryPoll({ requestToken: started.requestToken });
                if (p.state === 'SUCCEEDED') records = (p.result && p.result.records) || [];
                else if (p.state !== 'NOT_STARTED' && p.state !== 'RUNNING') throw new Error('query ended in state ' + p.state);
              }
              if (records === null) throw new Error('query timed out');
            } catch (e) {
              throw new Error('Cannot read ' + APP_CONFIG_PATH + '. Open the SRE maturity app, go to Settings and Save; that creates it. (' + (e && e.message ? e.message : e) + ')');
            }
            const raw = {};
            for (const r of records) raw[String(r.key)] = String(r.value === undefined || r.value === null ? '' : r.value).trim();
            const text = (k) => (raw[k] && raw[k] !== '-' ? raw[k] : '');
            const keyOk = /^[A-Za-z_][A-Za-z0-9_./-]*$/;
            const tagKeys = Array.from(new Set((text('tagKeys') || text('appIdKey')).split(',').map((k) => k.trim()).filter(Boolean)));
            if (!tagKeys.length || !tagKeys.every((k) => keyOk.test(k))) throw new Error(APP_CONFIG_PATH + ' has no valid tagKeys (found "' + text('tagKeys') + '"). Fix them in the app under Settings.');
            const cloudTagKey = text('cloudTagKey') || tagKeys[0];
            if (!keyOk.test(cloudTagKey)) throw new Error(APP_CONFIG_PATH + ' has an invalid cloudTagKey "' + cloudTagKey + '".');
            const idMaxLength = Number(raw.idMaxLength);
            if (!Number.isInteger(idMaxLength) || idMaxLength < 1 || idMaxLength > 64) throw new Error(APP_CONFIG_PATH + ' has an invalid idMaxLength "' + raw.idMaxLength + '".');
            return { tagKeys, appIdKey: tagKeys[0], cloudTagKey, idMaxLength, raw, text };
          }

          function applyAppConfig(text, c) {
            const hit = (arr) => {
              const one = (k) => 'matchesPhrase(' + arr + ', "*' + k + '*")';
              return c.tagKeys.length === 1 ? one(c.tagKeys[0]) : '(' + c.tagKeys.map(one).join(' or ') + ')';
            };
            return text
              .replace(/__TAGHIT__\(([^()]*)\)/g, (m, arr) => hit(arr))
              .split('__APPIDKEY__').join(c.appIdKey)
              .split('__CLOUDTAGKEY__').join(c.cloudTagKey)
              .split('__IDMAX__').join(String(c.idMaxLength));
          }

          let TAG_KEYS = [];
          let ID_MAX = 0;

          function sloAppId(s) {
            for (const key of TAG_KEYS) {
              const tag = (s.tags || []).find((t) => t.toLowerCase().startsWith(key + ':'));
              if (tag) return tag.slice(key.length + 1).trim().toLowerCase();
            }
            const m = /^([A-Za-z0-9]+)[^A-Za-z0-9]/.exec(s.name || '');
            return m && m[1].length <= ID_MAX ? m[1].toLowerCase() : '';
          }

          export default async function () {
            const cfg = await loadAppConfig();
            TAG_KEYS = cfg.tagKeys.map((k) => k.toLowerCase());
            ID_MAX = cfg.idMaxLength;
            // 1. Page through all SLOs
            const slos = [];
            let pageKey = null;
            do {
              const params = new URLSearchParams(
                pageKey ? { 'page-key': pageKey } : { 'page-size': '500' }
              );
              const r = await fetch(`/platform/slo/v1/slos?${params.toString()}`);
              if (!r.ok) {
                throw new Error(`SLO list read failed: ${r.status} ${await r.text()}`);
              }
              const body = await r.json();
              for (const s of body.slos || []) {
                if (s.name) slos.push({ name: s.name.replace(/[\r\n^]/g, ' '), id: sloAppId(s) || '-' });
              }
              pageKey = body.nextPageKey || null;
            } while (pageKey);

            // 2. Build CSV — one row per SLO name, sorted for deterministic diffs
            slos.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
            // Two '^'-separated columns (SLO names contain commas).
            const csv = 'slo^appId\n' + slos.map((s) => s.name + '^' + s.id).join('\n') + '\n';

            // 3. Upload as a lookup table (overwrite existing)
            const meta = {
              filePath: '/lookups/dtsrepoweredapp/slo',
              displayName: 'SLOs by application ID',
              description: 'One row per SLO name with its application ID (the SLO tag, else the name prefix)',
              lookupField: 'slo',
              parsePattern: "LD:slo '^' LD:appId",
              skippedRecords: 1,
              autoFlatten: true,
              timezone: 'UTC',
              locale: 'en_US',
              overwrite: true,
            };

            const boundary = '----slolookupboundary' + Date.now();
            const body =
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="request"\r\n` +
              `Content-Type: application/json\r\n\r\n` +
              `${JSON.stringify(meta)}\r\n` +
              `--${boundary}\r\n` +
              `Content-Disposition: form-data; name="content"; filename="slo"\r\n` +
              `Content-Type: application/octet-stream\r\n\r\n` +
              `${csv}\r\n` +
              `--${boundary}--\r\n`;

            const up = await fetch('/platform/storage/resource-store/v1/files/tabular/lookup:upload', {
              method: 'POST',
              headers: { 'Content-Type': `multipart/form-data; boundary=${boundary}` },
              body,
            });
            const upText = await up.text();
            if (!up.ok) {
              throw new Error(`Lookup upload failed: ${up.status} ${upText}`);
            }
            return { slosRead: slos.length };
          }
      action: dynatrace.automations:run-javascript
      position:
        x: 0
        y: 1
      conditions:
        states: {}
      description: Read all SLOs from the platform API, build one-row-per-name CSV,
        upload lookup table
      predecessors: []
