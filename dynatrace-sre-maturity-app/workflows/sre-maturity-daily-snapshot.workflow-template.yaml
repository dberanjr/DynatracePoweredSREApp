metadata:
  version: '1'
  dependencies:
    apps:
    - id: dynatrace.automations
      version: ^1.3590.2
  inputs: []
workflow:
  title: 'DT-SRE APP: Daily Maturity Snapshot (one bizevent per AppId)'
  description: Computes every application's L1-L5 maturity score daily and ingests one workflow.summary.sre_maturity
    bizevent per app for trend charting on the Scorecards page's Executive-mode hero.
  schemaVersion: 4
  trigger:
    schedule:
      isActive: true
      trigger:
        cron: 15 6 * * *
        type: cron
      filterParameters: {}
      timezone: UTC
      inputs: {}
  result: null
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  guide: null
  tasks:
    mergeAndIngest:
      name: mergeAndIngest
      input:
        script: |
          import { queryExecutionClient } from '@dynatrace-sdk/client-query';
          import { businessEventsClient } from '@dynatrace-sdk/client-classic-environment-v2';

          // ── Customer values, read at run time ─────────────────────────────────────────────────────────────────────────────
          // Every DT-SRE APP workflow except "Build /lookups/dtsrepoweredapp/cmdb" is identical for all customers. The few values
          // that differ (the application ID tag key, the cloud tag key, the longest ID) are written to
          // /lookups/dtsrepoweredapp/config by that workflow from its constants, and read here. Run it first.
          // The generated queries contain the placeholders __APPIDKEY__, __CLOUDTAGKEY__ and __IDMAX__; applyAppConfig fills them in.
          const APP_CONFIG_PATH = '/lookups/dtsrepoweredapp/config';

          async function loadAppConfig() {
            let records;
            try {
              const started = await queryExecutionClient.queryExecute({
                body: { query: 'load "' + APP_CONFIG_PATH + '"', maxResultRecords: 100, requestTimeoutMilliseconds: 30000 },
              });
              records = started.result ? started.result.records || [] : null;
              for (let i = 0; records === null && i < 60; i++) {
                await new Promise((r) => setTimeout(r, 500));
                const p = await queryExecutionClient.queryPoll({ requestToken: started.requestToken });
                if (p.state === 'SUCCEEDED') records = (p.result && p.result.records) || [];
                else if (p.state !== 'NOT_STARTED' && p.state !== 'RUNNING') throw new Error('query ended in state ' + p.state);
              }
              if (records === null) throw new Error('query timed out');
            } catch (e) {
              throw new Error('Cannot read ' + APP_CONFIG_PATH + '. Run the "DT-SRE APP: Build /lookups/dtsrepoweredapp/cmdb" workflow first, which writes it. (' + (e && e.message ? e.message : e) + ')');
            }
            const raw = {};
            for (const r of records) raw[String(r.key)] = String(r.value === undefined || r.value === null ? '' : r.value).trim();
            const ident = /^[A-Za-z_][A-Za-z0-9_]*$/;
            if (!ident.test(raw.appIdKey || '')) throw new Error(APP_CONFIG_PATH + ' has no valid appIdKey (found "' + raw.appIdKey + '").');
            const cloudTagKey = raw.cloudTagKey || raw.appIdKey;
            if (!ident.test(cloudTagKey)) throw new Error(APP_CONFIG_PATH + ' has an invalid cloudTagKey "' + cloudTagKey + '".');
            const idMaxLength = Number(raw.idMaxLength);
            if (!Number.isInteger(idMaxLength) || idMaxLength < 1 || idMaxLength > 64) throw new Error(APP_CONFIG_PATH + ' has an invalid idMaxLength "' + raw.idMaxLength + '".');
            return { appIdKey: raw.appIdKey, cloudTagKey, idMaxLength };
          }

          function applyAppConfig(text, c) {
            return text.split('__APPIDKEY__').join(c.appIdKey).split('__CLOUDTAGKEY__').join(c.cloudTagKey).split('__IDMAX__').join(String(c.idMaxLength));
          }

          // Snapshots are stored in their own Grail bucket (own retention, and its records can be deleted). Create it and its
          // OpenPipeline route once with scripts/setup-snapshot-bucket.mjs; this workflow stops with a clear error if it is missing.
          const SNAPSHOT_BUCKET = 'dtsrepoweredapp_snapshots';

          // GENERATED by scripts/generate-snapshot-workflow.mjs - do not edit the QUERIES below by hand.
          // The queries hold the placeholders __APPIDKEY__, __CLOUDTAGKEY__ and __IDMAX__, filled from the run-time config.
          // The five queries are the leaderboard's BULK_L1..BULK_L5 from ui/app/queries/maturityQueries.ts, so the
          // daily snapshot scores applications exactly as the live leaderboard does (including how an application ID is
          // resolved from tags and the application ID map table). Edit that module, then run `npm run generate:workflows`.
          // The template for everything else in this script is workflows/sre-maturity-daily-snapshot.script.template.js.
          const QUERIES = {
            l1: `fetch dt.entity.service
          | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
          | expand __APPIDKEY__
          | filter stringLength(__APPIDKEY__) <= __IDMAX__
          | summarize serviceCount = count(), by:{__APPIDKEY__}
          | lookup [
              fetch dt.entity.host
              | limit 100000
              | filter lifetime[end] > asTimestamp(now()-2h)
              | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
              | expand __APPIDKEY__
              // PaaS-injected hosts (ECS Fargate, EKS Fargate, etc.) never get a
              // monitoringMode value — PaaS OneAgent has no partial mode, it's always
              // full-stack or not present at all — so a null mode here still counts.
              | summarize
                  hostCount = count(),
                  fullStackCount = countIf(monitoringMode == "FULL_STACK" or isNull(monitoringMode)),
                  by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{hostCount, fullStackCount}
          | lookup [
              fetch dt.entity.cloud_application
              | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
              | expand __APPIDKEY__
              | summarize k8sCount = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{k8sCount}
          | lookup [
              smartscapeNodes K8S_DAEMONSET
              | filter matchesPhrase(k8s.workload.name, "oneagent") and not matchesPhrase(k8s.workload.name, "csi-driver")
              | fieldsAdd __APPIDKEY__ = lower(splitString(k8s.cluster.name, "-")[0])
              | parse k8s.object, "JSON:config"
              | fieldsAdd
                  component = \`tags:k8s.labels\`[\`app.kubernetes.io/component\`],
                  desired = toLong(config[status][desiredNumberScheduled]),
                  ready = toLong(config[status][numberReady])
              | summarize
                  cloudNativeOperatorHealthy = countIf(component == "cloudnativefullstack" and desired > 0 and ready == desired),
                  by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{cloudNativeOperatorHealthy}
          | lookup [
              timeseries reqs = sum(dt.service.request.count), by:{k8s.cluster.name}, from:now()-2h
              | fieldsAdd __APPIDKEY__ = lower(splitString(k8s.cluster.name, "-")[0]),
                  total = arraySum(reqs)
              | summarize k8sScopedTracing = sum(total), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{k8sScopedTracing}
          | lookup [
              fetch logs, samplingRatio:1000, from:now()-2h
              | filter isNotNull(k8s.cluster.name)
              | fieldsAdd __APPIDKEY__ = lower(splitString(k8s.cluster.name, "-")[0])
              | summarize k8sScopedLogs = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{k8sScopedLogs}
          | lookup [
              fetch logs, samplingRatio:1000
              | filter isNotNull(__APPIDKEY__)
              | summarize logCount = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{logCount}
          | lookup [
              smartscapeNodes "AWS*"
              | fieldsFlatten \`tags:aws\`, fields:{__CLOUDTAGKEY__}
              | append [
                  smartscapeNodes "AZURE*"
                  | fieldsFlatten \`tags:azure\`, fields:{__CLOUDTAGKEY__}
                ]
              | append [
                  smartscapeNodes "GCP*"
                  | fieldsFlatten \`tags:gcp_labels\`, fields:{__CLOUDTAGKEY__}
                ]
              | filter isNotNull(__CLOUDTAGKEY__)
              | fieldsAdd __APPIDKEY__ = lower(__CLOUDTAGKEY__)
              | summarize cloudCount = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{cloudCount}
          | lookup [
              fetch dt.entity.application, from:now()-1000d
              | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
              | expand __APPIDKEY__
              | fieldsAdd rumActive = if(lifetime[end] > now()-7d, true, else: false)
              | summarize rumCount = countIf(rumActive == true), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{rumCount}
          | lookup [
              fetch dt.entity.synthetic_test
              | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
              | expand __APPIDKEY__
              | summarize synCount = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{synCount}
          | fieldsAdd
              hostCount = if(isNull(hostCount), 0, else: hostCount),
              serviceCount = if(isNull(serviceCount), 0, else: serviceCount),
              k8sCount = if(isNull(k8sCount), 0, else: k8sCount),
              cloudNativeOperatorHealthy = if(isNull(cloudNativeOperatorHealthy), 0, else: cloudNativeOperatorHealthy),
              k8sScopedTracing = if(isNull(k8sScopedTracing), 0, else: k8sScopedTracing),
              k8sScopedLogs = if(isNull(k8sScopedLogs), 0, else: k8sScopedLogs),
              logCount = if(isNull(logCount), 0, else: logCount),
              cloudCount = if(isNull(cloudCount), 0, else: cloudCount),
              rumCount = if(isNull(rumCount), 0, else: rumCount),
              synCount = if(isNull(synCount), 0, else: synCount)
          | fieldsAdd k8sHealthy = cloudNativeOperatorHealthy > 0 and k8sScopedTracing > 0 and k8sScopedLogs > 0
          | fieldsAdd l1Score =
              if(hostCount > 0, 1, else: 0)
              + if(serviceCount > 0, 1, else: 0)
              + if(logCount > 0, 1, else: 0)
              + if(serviceCount > 0, 1, else: 0)
              + if(k8sCount == 0 or k8sHealthy, 1, else: 0)
              + 1
              + if(rumCount > 0 or synCount > 0, 1, else: 0)
          | fields __APPIDKEY__, l1Score, serviceCount, hostCount, k8sCount, logCount`,
            l2: `fetch dt.entity.service
          | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
          | expand __APPIDKEY__
          | filter stringLength(__APPIDKEY__) <= __IDMAX__
          | summarize serviceCount = count(), by:{__APPIDKEY__}
          | lookup [
              load "/lookups/dtsrepoweredapp/slo_dashboards"
              | fieldsAdd appId = lower(appId)
              | summarize dashboardCount = count(), by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{dashboardCount}
          | lookup [
              load "/lookups/dtsrepoweredapp/cmdb"
          | fieldsAdd __APPIDKEY__ = appId
              | fieldsAdd __APPIDKEY__ = lower(__APPIDKEY__)
              | filter isNotNull(business_criticality) and trim(business_criticality) != ""
              | summarize hasTierCmdb = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{hasTierCmdb}
          | lookup [
              fetch bizevents, from:now()-24h
              | filter event.type == "workflow.import.servicenow.appci"
              | fieldsAdd __APPIDKEY__ = lower(__APPIDKEY__)
              | filter isNotNull(tier)
              | summarize hasTierImport = count(), by:{__APPIDKEY__}
            ], sourceField:__APPIDKEY__, lookupField:__APPIDKEY__, fields:{hasTierImport}
          | fieldsAdd hasTier = coalesce(hasTierCmdb, 0) + coalesce(hasTierImport, 0)
          | fieldsRemove hasTierCmdb, hasTierImport
          | lookup [
              load "/lookups/dtsrepoweredapp/slo"
              | fieldsAdd appId = lower(appId)
              | summarize sloCount = count(), by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{sloCount}
          | lookup [
              load "/lookups/dtsrepoweredapp/guardians"
              | fieldsAdd appId = lower(appId)
              | summarize guardianCount = count(), by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{guardianCount}
          | lookup [
              load "/lookups/dtsrepoweredapp/critical_services"
              | fieldsAdd appId = lower(appId)
              | summarize criticalCount = count(), resolved = countIf(entity_ids != "-"), by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{criticalCount, resolved}
          | fieldsAdd
              dashboardCount = if(isNull(dashboardCount), 0, else: dashboardCount),
              hasTier = if(isNull(hasTier), 0, else: hasTier),
              sloCount = if(isNull(sloCount), 0, else: sloCount),
              guardianCount = if(isNull(guardianCount), 0, else: guardianCount),
              criticalCount = if(isNull(criticalCount), 0, else: criticalCount),
              resolved = if(isNull(resolved), 0, else: resolved)
          | fieldsAdd l2Score =
              if(serviceCount > 0, 1, else: 0)
              + if(sloCount > 0, 1, else: 0)
              + if(guardianCount > 0, 1, else: 0)
              + if(dashboardCount > 0, 1, else: 0)
              + if(hasTier > 0, 1, else: 0)
              + if(resolved > 0 or criticalCount == 0, 1, else: 0)
          | fields __APPIDKEY__, l2Score`,
            l3: `fetch dt.entity.service
          | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
          | expand __APPIDKEY__
          | filter stringLength(__APPIDKEY__) <= __IDMAX__
          | summarize svcCount = count(), by:{__APPIDKEY__}
          | lookup [
              fetch dt.davis.problems, from:now()-7d
              | filter isNull(dt.davis.is_duplicate) or not(dt.davis.is_duplicate)
              | fieldsAdd appId = splitString(splitString(toString(entity_tags), "__APPIDKEY__:")[1], "\\"")[0]
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(entity_tags[]), "application:"), substring(entity_tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd appId = coalesce(appId, lower(appIdMapped))
          | fieldsRemove appIdName, appIdMapped
              | filter isNotNull(appId)
              | fieldsAdd eventCount = arraySize(dt.davis.event_ids)
              | fieldsAdd isCausal = matchesValue(event.category, array("ERROR", "SLOWDOWN")) and eventCount > 1
              | fieldsAdd isNoise = eventCount == 1 and matchesValue(event.category, array("AVAILABILITY", "RESOURCE_CONTENTION", "CUSTOM_ALERT", "MONITORING_UNAVAILABLE"))
              | summarize
                  total7d = count(),
                  causalTotal = countIf(isCausal),
                  causalWithCause = countIf(isCausal and isNotNull(root_cause_entity_id)),
                  noiseTotal = countIf(isNoise),
                  by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{total7d, causalTotal, causalWithCause, noiseTotal}
          | lookup [
              fetch events, from:now()-30d
              | filter event.type == "CUSTOM_DEPLOYMENT"
              | filter isNotNull(application_ci)
              | summarize deployTotal = count(), by:{appId = lower(application_ci)}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{deployTotal}
          | lookup [
              fetch dt.system.events, from:now()-30d
              | filter event.provider == "AUTOMATION_ENGINE"
              | filter event.kind == "WORKFLOW_EVENT" and event.type == "WORKFLOW_EXECUTION"
              | filter matchesValue(\`dt.automation_engine.workflow.title\`, "* Production Dynatrace Alerts")
              | fieldsAdd wfAppId = lower(arrayFirst(splitString(\`dt.automation_engine.workflow.title\`, " ")))
              | summarize itsmWorkflows = countDistinct(\`dt.automation_engine.workflow.id\`), by:{wfAppId}
            ], sourceField:__APPIDKEY__, lookupField:wfAppId, fields:{itsmWorkflows}
          | fieldsAdd
              total7d = if(isNull(total7d), 0, else: total7d),
              causalTotal = if(isNull(causalTotal), 0, else: causalTotal),
              causalWithCause = if(isNull(causalWithCause), 0, else: causalWithCause),
              noiseTotal = if(isNull(noiseTotal), 0, else: noiseTotal),
              deployTotal = if(isNull(deployTotal), 0, else: deployTotal),
              itsmWorkflows = if(isNull(itsmWorkflows), 0, else: itsmWorkflows)
          | fieldsAdd noisePct = if(total7d > 0, round(toDouble(noiseTotal) * 100.0 / toDouble(total7d), decimals:0), else: 0.0)
          | fieldsAdd rootCausePct = if(causalTotal > 0, round(toDouble(causalWithCause) * 100.0 / toDouble(causalTotal), decimals:0), else: 0.0)
          | fieldsAdd l3Score =
              if(causalTotal > 0, 1, else: 0)
              + if(deployTotal > 0, 1, else: 0)
              + if(itsmWorkflows > 0, 1, else: 0)
              + 0
              + if(total7d == 0 or noisePct <= 50, 1, else: 0)
              + if(causalTotal == 0 or rootCausePct >= 40, 1, else: 0)
              + if(deployTotal > 0, 1, else: 0)
          | fields __APPIDKEY__, l3Score`,
            l4: `fetch dt.entity.service
          | fieldsAdd appIdTagged = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayRemoveNulls(
                    iCollectArray(
                      if(matchesPhrase(tags[], "*__APPIDKEY__*"), lower(tags[]))
                    )
                  )[], ":"
                )[1]
              )
            )
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(tags[]), "application:"), substring(tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = arrayDistinct(
              iCollectArray(
                splitString(
                  arrayConcat(appIdTagged, if(isNotNull(appIdMapped), array(lower(appIdMapped)), else: array()))[], ","
                )[0]
              )
            )
          | fieldsRemove appIdTagged, appIdName, appIdMapped
          | expand __APPIDKEY__
          | filter stringLength(__APPIDKEY__) <= __IDMAX__
          | summarize svcCount = count(), by:{__APPIDKEY__}
          | lookup [
              fetch dt.davis.problems, from:now()-30d
              | filter isNull(dt.davis.is_duplicate) or not(dt.davis.is_duplicate)
              | filter event.category == "CUSTOM_ALERT"
              | filter contains(lower(event.name), "burn rate")
              | fieldsAdd appId = lower(trim(splitString(event.name, " - ")[0]))
              | filter stringLength(appId) == 3
              | summarize burnAlerts = countDistinct(event.name), by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{burnAlerts}
          | lookup [
              smartscapeNodes "AWS*"
              | fieldsFlatten \`tags:aws\`, fields:{__CLOUDTAGKEY__}
              | filter isNotNull(__CLOUDTAGKEY__)
              | summarize
                  cloudTotal = count(),
                  scaleTargets = countIf(matchesValue(type, "AWS_AUTOSCALING_AUTOSCALINGGROUP", "AWS_APPLICATIONAUTOSCALING_SCALABLETARGET", "AWS_EKS_NODEGROUP")),
                  by:{appId = lower(__CLOUDTAGKEY__)}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{cloudTotal, scaleTargets}
          | lookup [
              fetch events, from:now()-30d
              | filter event.kind == "SDLC_EVENT"
              | filter event.type == "validation" and event.status == "finished"
              | fieldsAdd appId = lower(splitString(splitString(dt.srg.tags, "\\"__CLOUDTAGKEY__\\":[\\"")[1], "\\"")[0])
              | filter isNotNull(appId)
              | fieldsAdd trig = coalesce(\`dt.automation_engine.workflow_execution.trigger.type\`, "Manual")
              | summarize srgEventTriggered = countIf(trig != "Schedule" and trig != "Manual"), by:{appId}
            ], sourceField:__APPIDKEY__, lookupField:appId, fields:{srgEventTriggered}
          | fieldsAdd
              burnAlerts = if(isNull(burnAlerts), 0, else: burnAlerts),
              cloudTotal = if(isNull(cloudTotal), 0, else: cloudTotal),
              scaleTargets = if(isNull(scaleTargets), 0, else: scaleTargets),
              srgEventTriggered = if(isNull(srgEventTriggered), 0, else: srgEventTriggered)
          | fieldsAdd l4Score =
              if(burnAlerts > 0, 1, else: 0)
              + if(scaleTargets > 0 or cloudTotal == 0, 1, else: 0)
              + 0
              + if(srgEventTriggered > 0, 1, else: 0)
              + 0
          | fields __APPIDKEY__, l4Score`,
            l5: `fetch dt.davis.problems
          | fieldsAdd appId = splitString(splitString(toString(entity_tags), "__APPIDKEY__:")[1], "\\"")[0]
          | fieldsAdd appIdName = lower(arrayFirst(splitString(replaceString(arrayFirst(arrayRemoveNulls(iCollectArray(if(startsWith(lower(entity_tags[]), "application:"), substring(entity_tags[], from: 12))))), "\\\\", ""), "::")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:appIdName, lookupField:app_name, fields:{appIdMapped = __APPIDKEY__}
          | fieldsAdd appId = coalesce(appId, lower(appIdMapped))
          | fieldsRemove appIdName, appIdMapped
          | filter isNotNull(appId)
          | filter dt.davis.is_duplicate == false
          | fieldsAdd hasItsmProfile = toString(labels.alerting_profile) != "[\\"Default\\"]"
              and isNotNull(labels.alerting_profile)
          | summarize
              totalProblems = count(),
              enrichedProblems = countIf(hasItsmProfile == true),
              by:{__APPIDKEY__ = appId}
          | append [
              fetch dt.system.events, from:now()-30d
              | filter event.provider == "AUTOMATION_ENGINE"
              | filter event.kind == "WORKFLOW_EVENT" and event.type == "WORKFLOW_EXECUTION"
              | fieldsAdd wfWord = lower(arrayFirst(splitString(\`dt.automation_engine.workflow.title\`, " ")))
          | fieldsAdd wfName = lower(arrayFirst(splitString(wfWord, "_")))
          | lookup [
              load "/lookups/dtsrepoweredapp/app_map"
          | fieldsAdd __APPIDKEY__ = appId
              | fields app_name, __APPIDKEY__
            ], sourceField:wfName, lookupField:app_name, fields:{wfMapped = __APPIDKEY__}
          | fieldsAdd __APPIDKEY__ = if(stringLength(wfWord) == 3, wfWord, else: lower(wfMapped))
          | fieldsRemove wfWord, wfName, wfMapped
              | filter stringLength(__APPIDKEY__) == 3
              | summarize workflowCount = countDistinct(\`dt.automation_engine.workflow.id\`), by:{__APPIDKEY__}
            ]
          | summarize
              totalProblems = sum(totalProblems),
              enrichedProblems = sum(enrichedProblems),
              workflowCount = sum(workflowCount),
              by:{__APPIDKEY__}
          | filter stringLength(__APPIDKEY__) <= __IDMAX__
          | fieldsAdd
              totalProblems = if(isNull(totalProblems), 0, else: totalProblems),
              enrichedProblems = if(isNull(enrichedProblems), 0, else: enrichedProblems),
              workflowCount = if(isNull(workflowCount), 0, else: workflowCount)
          | fieldsAdd enrichPct = if(totalProblems > 0,
              round(toDouble(enrichedProblems) * 100.0 / toDouble(totalProblems), decimals:0),
              else: 0.0)
          | fieldsAdd l5Score =
              if(workflowCount > 0, 1, else: 0)
              + if(workflowCount > 0, 1, else: 0)
              + 0
              + if(totalProblems > 0 and enrichPct >= 50, 1, else: 0)
              + 0
          | fields __APPIDKEY__, l5Score`,
          };

          // Grail's query execution API silently caps a single query at 1000 result
          // records unless maxResultRecords is raised explicitly (confirmed live:
          // computeL5 returned exactly 1000 of ~1417 real distinct apps before this
          // fix). The native dynatrace.automations:execute-dql-query workflow action
          // does NOT forward a maxResultRecords-style input through to the
          // underlying query — verified by testing it directly against this tenant
          // (the "Your result has been limited to 1000" API warning still fired even
          // with that field set on the task input). Calling queryExecutionClient
          // directly, as this script does, is the one place maxResultRecords is
          // actually honored.
          const MAX_RESULT_RECORDS = 5000;

          async function runQuery(query) {
            const start = await queryExecutionClient.queryExecute({
              body: { query, maxResultRecords: MAX_RESULT_RECORDS, requestTimeoutMilliseconds: 60000 },
            });
            let state = start.state;
            let result = start.result;
            let token = start.requestToken;
            while (state !== 'SUCCEEDED' && token) {
              // eslint-disable-next-line no-await-in-loop
              const poll = await queryExecutionClient.queryPoll({ requestToken: token });
              state = poll.state;
              result = poll.result;
              if (state === 'SUCCEEDED' || state === 'FAILED' || state === 'CANCELLED' || state === 'RESULT_GONE') break;
              // eslint-disable-next-line no-await-in-loop
              await new Promise((r) => setTimeout(r, 1000));
            }
            if (state !== 'SUCCEEDED') {
              throw new Error(`Query did not succeed (state=${state}): ${query.slice(0, 80)}...`);
            }
            const records = (result && result.records) || [];
            if (records.length >= MAX_RESULT_RECORDS) {
              // Still hit the ceiling even after raising it — surface this loudly
              // rather than silently under-counting; bump MAX_RESULT_RECORDS further
              // if this ever fires for real.
              // eslint-disable-next-line no-console
              console.warn(`Query returned ${records.length} records, at or above MAX_RESULT_RECORDS=${MAX_RESULT_RECORDS} — results may be truncated: ${query.slice(0, 80)}...`);
            }
            return records;
          }

          // Denominators must match ScorecardsPage.tsx's `L{n} Score` = concat(passCount, " / N")
          // and checkDetailConfigs.ts's LEVEL_CHECK_COUNT (L1:7, L2:6, L3:7, L4:5, L5:5).
          const LEVEL_MAX = { l1: 7, l2: 6, l3: 7, l4: 5, l5: 5 };
          const LEVELS = ['l1', 'l2', 'l3', 'l4', 'l5'];
          const TOTAL_MAX = LEVELS.reduce((s, k) => s + LEVEL_MAX[k], 0); // 30

          // Mirrors ui/app/components/MaturitySpine.tsx's getCurrentLevel(): a
          // cumulative 80%-gate walk up the levels, NOT MaturityLeaderboard.tsx's
          // different single-threshold getMaturityLevel(pct) bucketing. The daily
          // snapshot's grade must match the live scorecard's own grading.
          function currentGrade(scores) {
            const THRESHOLD = 0.8;
            let idx = 0;
            for (let i = 0; i < LEVELS.length; i++) {
              const key = LEVELS[i];
              const pct = LEVEL_MAX[key] > 0 ? scores[key] / LEVEL_MAX[key] : 0;
              if (pct >= THRESHOLD) idx = Math.min(i + 1, LEVELS.length - 1);
              else { idx = i; break; }
            }
            return LEVELS[idx].toUpperCase(); // "L1".."L5"
          }

          function toMap(records, scoreField, idKey) {
            const m = new Map();
            for (const r of records || []) {
              const appId = String(r[idKey] || '').trim().toLowerCase();
              if (!appId) continue;
              m.set(appId, Number(r[scoreField] || 0));
            }
            return m;
          }

          export default async function () {
            const cfg = await loadAppConfig();
            const Q = (key) => applyAppConfig(QUERIES[key], cfg);

            // The bucket must exist, otherwise events would land in the default bucket where the app can't find them.
            const bucket = await runQuery('fetch dt.system.buckets | filter name == "' + SNAPSHOT_BUCKET + '" and dt.system.table == "bizevents" | fields name');
            if (bucket.length === 0) {
              throw new Error('Grail bucket "' + SNAPSHOT_BUCKET + '" (table bizevents) does not exist. Create it, with its OpenPipeline route, using scripts/setup-snapshot-bucket.mjs.');
            }

            const [l1, l2, l3, l4, l5] = await Promise.all([
              runQuery(Q('l1')), runQuery(Q('l2')), runQuery(Q('l3')),
              runQuery(Q('l4')), runQuery(Q('l5')),
            ]);

            const l1Map = toMap(l1, 'l1Score', cfg.appIdKey);
            const l2Map = toMap(l2, 'l2Score', cfg.appIdKey);
            const l3Map = toMap(l3, 'l3Score', cfg.appIdKey);
            const l4Map = toMap(l4, 'l4Score', cfg.appIdKey);
            const l5Map = toMap(l5, 'l5Score', cfg.appIdKey);

            // Union of every appId seen in ANY of the 5 result sets — deliberately not
            // anchored on l1Map only. MaturityLeaderboard.tsx's client-side merge
            // anchors on l1Map.entries() as "all apps," which would silently drop an
            // app that only appears in another level's independently-derived set.
            // Since the goal here is "snapshot every app," union is correct.
            const allAppId = new Set([
              ...l1Map.keys(), ...l2Map.keys(), ...l3Map.keys(), ...l4Map.keys(), ...l5Map.keys(),
            ]);

            const snapshotDate = new Date().toISOString().slice(0, 10); // YYYY-MM-DD

            const events = [];
            for (const appId of allAppId) {
              const scores = {
                l1: l1Map.get(appId) || 0, l2: l2Map.get(appId) || 0,
                l3: l3Map.get(appId) || 0, l4: l4Map.get(appId) || 0,
                l5: l5Map.get(appId) || 0,
              };
              const total = LEVELS.reduce((s, k) => s + scores[k], 0);
              const pct = Math.round((total / TOTAL_MAX) * 100);
              const grade = currentGrade(scores);

              events.push({
                specversion: '1.0',
                id: `${appId}-${snapshotDate}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                source: 'sre-maturity-daily-snapshot-workflow',
                type: 'workflow.summary.sre_maturity',
                time: new Date().toISOString(),
                data: {
                  appId,
                  snapshotDate,
                  l1Score: scores.l1, l2Score: scores.l2, l3Score: scores.l3,
                  l4Score: scores.l4, l5Score: scores.l5,
                  total, totalMax: TOTAL_MAX, pct, grade,
                },
              });
            }

            // Batches of 500 bound blast radius / retry granularity per network call —
            // not driven by the 5 MiB payload cap (at ~2,000 apps x ~400 bytes each, a
            // single batch is well under 1 MiB).
            const BATCH_SIZE = 500;
            let batchesOk = 0;
            const failedBatches = [];
            for (let i = 0; i < events.length; i += BATCH_SIZE) {
              const chunk = events.slice(i, i + BATCH_SIZE);
              try {
                await businessEventsClient.ingest({
                  type: 'application/cloudevent-batch+json',
                  body: chunk,
                });
                batchesOk++;
              } catch (err) {
                // A partially-invalid batch still ingests its valid events per
                // businessEventsClient.ingest's documented behavior — log and
                // continue so one bad record doesn't block the other apps.
                failedBatches.push({ startIndex: i, size: chunk.length, error: String(err) });
              }
            }

            // Surface ingest failures: a task that returns normally is reported as SUCCESS even if nothing was written.
            if (failedBatches.length || events.length === 0) {
              throw new Error(
                events.length === 0
                  ? 'No applications were scored (record counts l1..l5: ' + [l1, l2, l3, l4, l5].map((r) => r.length).join('/') + ').'
                  : 'Ingest failed for ' + failedBatches.length + ' of ' + Math.ceil(events.length / BATCH_SIZE) + ' batches: ' + failedBatches[0].error
              );
            }

            // Confirm the events reached the snapshot bucket (a missing OpenPipeline route would send them to the default bucket).
            let arrived = 0;
            for (let i = 0; i < 8 && arrived === 0; i++) {
              // eslint-disable-next-line no-await-in-loop
              await new Promise((r) => setTimeout(r, 6000));
              // eslint-disable-next-line no-await-in-loop
              const seen = await runQuery('fetch bizevents, from:now()-15m | filter dt.system.bucket == "' + SNAPSHOT_BUCKET + '" and event.type == "workflow.summary.sre_maturity" | summarize n = count()');
              arrived = Number((seen[0] && seen[0].n) || 0);
            }
            if (arrived === 0) {
              throw new Error('Ingested ' + events.length + ' events but none reached bucket "' + SNAPSHOT_BUCKET + '" within a minute. Check the OpenPipeline route for event.type "workflow.summary.sre_maturity" (scripts/setup-snapshot-bucket.mjs).');
            }

            return {
              appsProcessed: allAppId.size,
              eventsInBucket: arrived,
              recordCounts: { l1: l1.length, l2: l2.length, l3: l3.length, l4: l4.length, l5: l5.length },
              batchesTotal: Math.ceil(events.length / BATCH_SIZE),
              batchesOk,
              batchesFailed: failedBatches.length,
              failedBatches,
            };
          }
      action: dynatrace.automations:run-javascript
      position:
        x: 0
        y: 1
      conditions:
        states: {}
      description: Run L1-L5 bulk queries directly (maxResultRecords-controlled),
        merge by applicationci, ingest one bizevent per app
      predecessors: []
